# Testy na Windowsie, paczka aplikacji, jej samosprawdzenie i instalator.
# Instalator jest do pobrania z zakładki Actions (Artifacts); po wypchnięciu tagu wersji,
# np. v0.1.0, trafia też do Releases.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked --group build

      - name: Install interface dependencies
        run: npm ci --prefix frontend

      - name: Lint Python
        run: uv run ruff check .

      - name: Lint interface
        run: npm --prefix frontend run lint

      - name: Tests
        run: uv run pytest

      - name: Build interface
        run: npm --prefix frontend run build

      - name: Package application
        run: uv run pyinstaller packaging/faktury-ksef.spec --noconfirm --distpath dist --workpath build

      - name: Self-check of the packaged application
        run: |
          $app = Start-Process -FilePath "dist\Faktury KSeF\Faktury KSeF.exe" -ArgumentList "--self-check" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Faktury KSeF\logi\aplikacja.log" -ErrorAction SilentlyContinue
          if ($app.ExitCode -ne 0) { throw "Self-check failed with exit code $($app.ExitCode)" }

      - name: Build installer
        run: |
          $version = (uv version --short).Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          $paths = "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe"
          $iscc = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: Faktury-KSeF-Setup
          path: dist/Faktury-KSeF-Setup-*.exe
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Faktury-KSeF-Setup

      - name: Publish release
        run: >
          gh release create "$GITHUB_REF_NAME" Faktury-KSeF-Setup-*.exe
          --repo "$GITHUB_REPOSITORY" --title "Faktury KSeF $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
