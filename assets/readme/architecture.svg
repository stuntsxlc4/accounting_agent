<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Accounting Agent architecture</title>
  <desc id="arch-desc">A native desktop window with a React interface talks to a local FastAPI service over a session token. The service layer is shared with the command line and uses adapters for the KSeF API, bank statement parsers, PDF and Excel output, and a local store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060C19"/>
      <stop offset="1" stop-color="#0A1529"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#12233F"/>
      <stop offset="1" stop-color="#0C182D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3B8EEA"/>
    </marker>
  </defs>
  <rect width="1600" height="640" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="638" rx="27" fill="none" stroke="#3B8EEA" stroke-opacity="0.25" stroke-width="2"/>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="64" y="78" fill="#7FC3FF" font-size="22" font-weight="600" letter-spacing="5">ARCHITECTURE</text>
    <text x="64" y="120" fill="#FFFFFF" font-size="38" font-weight="700">Everything runs on the user's computer</text>

    <!-- okno aplikacji -->
    <rect x="64" y="170" width="400" height="200" rx="18" fill="url(#card)" stroke="#3B8EEA" stroke-opacity="0.45"/>
    <text x="92" y="214" fill="#FFFFFF" font-size="25" font-weight="700">Desktop window</text>
    <text x="92" y="248" fill="#9DB4D3" font-size="19">React · TypeScript · Mantine</text>
    <text x="92" y="278" fill="#9DB4D3" font-size="19">Dashboard · Invoices · Statements</text>
    <text x="92" y="308" fill="#9DB4D3" font-size="19">Settings · background job progress</text>
    <text x="92" y="346" fill="#7FC3FF" font-size="17">native window (pywebview)</text>

    <rect x="64" y="410" width="400" height="150" rx="18" fill="url(#card)" stroke="#3B8EEA" stroke-opacity="0.3"/>
    <text x="92" y="454" fill="#FFFFFF" font-size="25" font-weight="700">Command line</text>
    <text x="92" y="488" fill="#9DB4D3" font-size="19">download · reconcile · login test</text>
    <text x="92" y="518" fill="#9DB4D3" font-size="19">same operations as the app</text>

    <!-- API i usługi -->
    <rect x="590" y="170" width="420" height="200" rx="18" fill="url(#card)" stroke="#3B8EEA" stroke-opacity="0.45"/>
    <text x="618" y="214" fill="#FFFFFF" font-size="25" font-weight="700">Local API</text>
    <text x="618" y="248" fill="#9DB4D3" font-size="19">FastAPI on 127.0.0.1</text>
    <text x="618" y="278" fill="#9DB4D3" font-size="19">per-session token</text>
    <text x="618" y="308" fill="#9DB4D3" font-size="19">one background job at a time</text>

    <rect x="590" y="410" width="420" height="150" rx="18" fill="url(#card)" stroke="#1FB89A" stroke-opacity="0.6"/>
    <text x="618" y="454" fill="#FFFFFF" font-size="25" font-weight="700">Service layer</text>
    <text x="618" y="488" fill="#9DB4D3" font-size="19">download · reconcile · payment register</text>
    <text x="618" y="518" fill="#9DB4D3" font-size="19">matching · KSeF caches</text>

    <!-- adaptery -->
    <g font-size="20">
      <rect x="1106" y="170" width="430" height="70" rx="14" fill="url(#card)" stroke="#3B8EEA" stroke-opacity="0.35"/>
      <text x="1132" y="213" fill="#FFFFFF" font-weight="700">KSeF API 2.0 client</text>
      <text x="1360" y="213" fill="#9DB4D3" font-size="17">rate-limit aware</text>
      <rect x="1106" y="258" width="430" height="70" rx="14" fill="url(#card)" stroke="#3B8EEA" stroke-opacity="0.35"/>
      <text x="1132" y="301" fill="#FFFFFF" font-weight="700">Statement parsers</text>
      <text x="1360" y="301" fill="#9DB4D3" font-size="17">balance-checked</text>
      <rect x="1106" y="346" width="430" height="70" rx="14" fill="url(#card)" stroke="#3B8EEA" stroke-opacity="0.35"/>
      <text x="1132" y="389" fill="#FFFFFF" font-weight="700">PDF and Excel output</text>
      <text x="1360" y="389" fill="#9DB4D3" font-size="17">invoices, reports</text>
      <rect x="1106" y="434" width="430" height="70" rx="14" fill="url(#card)" stroke="#1FB89A" stroke-opacity="0.55"/>
      <text x="1132" y="477" fill="#FFFFFF" font-weight="700">Local store</text>
      <text x="1360" y="477" fill="#9DB4D3" font-size="17">register, history, logs</text>
      <rect x="1106" y="522" width="430" height="70" rx="14" fill="url(#card)" stroke="#3B8EEA" stroke-opacity="0.35"/>
      <text x="1132" y="565" fill="#FFFFFF" font-weight="700">OS credential store</text>
      <text x="1360" y="565" fill="#9DB4D3" font-size="17">key password</text>
    </g>

    <g stroke="#3B8EEA" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M466 270H586"/>
      <path d="M800 372V406"/>
      <path d="M466 485H586"/>
      <path d="M1012 485C1060 485 1060 205 1102 205"/>
      <path d="M1012 485C1060 485 1060 293 1102 293"/>
      <path d="M1012 485C1060 485 1060 381 1102 381"/>
      <path d="M1012 485H1102"/>
      <path d="M1012 485C1060 485 1060 557 1102 557"/>
    </g>
    <text x="526" y="256" fill="#7FC3FF" font-size="15" text-anchor="middle">HTTP + token</text>
  </g>
</svg>
