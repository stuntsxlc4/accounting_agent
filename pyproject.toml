[project]
name = "accounting-agent"
version = "0.1.0"
description = "Pobieranie faktur z KSeF i zapis jako PDF"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.146.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "send2trash>=2.1.0",
    "signxml>=5.1.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
ksef = "accounting_agent.cli:main"

[project.gui-scripts]
faktury-ksef = "accounting_agent.desktop:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
