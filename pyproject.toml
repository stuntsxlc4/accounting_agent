[project]
name = "accounting-agent"
version = "0.1.0"
description = "Pobieranie faktur z KSeF i zapis jako PDF"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "signxml>=5.1.0",
]

[project.scripts]
ksef = "accounting_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
